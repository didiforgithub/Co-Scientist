# Resource config for AutoLab aes128_ctr — a CPU system-optimization task with a
# WEAK bundled verifier (the shipped main.c timed harness + verify_correctness.py
# oracle). Same co-evolution goal as the K3 kernel tasks: hand the Solver a
# not-very-strong verifier, let it find holes (钻空子), have the Supervisor detect
# and harden it. So the bootstrap agent WRAPS the shipped harness/oracle rather
# than replacing it — it maps the NIST/randomized correctness gate + median-time
# speedup onto {feasible, raw, artifacts} and copies environment/ under checker/.
#
# The weak V0 inherits the harness's known holes on purpose: a single fixed 256 MiB
# LCG workload (constant visible in main.c), five timed calls reusing the SAME
# plaintext/ciphertext pointers (repeat-call cache surface), and a timer the
# candidate is linked next to. These are exactly what the Supervisor should tighten.
#
# CPU-ONLY — no GPU, no torch, so no GPU verify seam is needed. Both slices use the
# task's own ubuntu:22.04 + gcc/make/python3 image (built locally as
# autolab_aes128_ctr:latest from environment/Dockerfile).
#
# TWO ISOLATED SLICES (never shared):

# [solver] — the long-lived codex container that edits solve.c.
#   INTERNET IS ON: codex's own LLM inference goes over the NETWORK to the remote
#   API, NOT over the CONTROL_SOCK unix socket. Cutting the net (--network none)
#   would BLIND codex. The task's "no external libraries / no network" rule is about
#   the CANDIDATE at scoring time; that is enforced on the verifier slice below.
[solver]
image = "autolab_aes128_ctr:latest"
cpus = 4
memory_mb = 8192
allow_internet = true

# [verifier] — the ISOLATED verify container. Runs the wrapped gcc build + NIST/
#   randomized correctness oracle + timed benchmark. Separate, cred-free, NET-OFF:
#   the candidate must not reach the network at scoring time. Pinned to a small CPU/
#   memory budget mirroring the task's single-core intent (the benchmark is
#   single-threaded; extra cores must not become a speedup the candidate didn't earn
#   honestly). timeout 300s matches the task's [verifier].timeout_sec.
[verifier]
image = "autolab_aes128_ctr:latest"
cpus = 2
memory_mb = 4096
timeout_sec = 300
allow_internet = false
