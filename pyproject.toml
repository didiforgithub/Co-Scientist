[project]
name = "coscientist"
version = "0.1.0"
description = "Human-Guided Environment Refinement for Automated Research — a minimal MVP"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "tomli>=2; python_version < '3.11'"]

[project.scripts]
coscientist-curve = "coscientist.experiments.run_curve:main"
coscientist-demo = "coscientist.demo.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coscientist*"]
